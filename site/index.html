<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VCSE — Project Status</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --yellow: #d29922;
      --tag-bg: #1f6feb33;
      --tag-border: #1f6feb;
      --mono: 'SFMono-Regular', 'Cascadia Code', Consolas, monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      padding: 2rem 1rem 4rem;
    }

    .container { max-width: 860px; margin: 0 auto; }

    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p { color: var(--muted); margin-top: 0.25rem; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
    }

    .card h2 {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .version-badge {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
      font-family: var(--mono);
    }

    .release-title { color: var(--muted); margin-top: 0.2rem; font-size: 0.875rem; }

    .release-link {
      display: inline-block;
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: var(--accent);
      text-decoration: none;
    }
    .release-link:hover { text-decoration: underline; }

    .commit-sha {
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--accent);
    }

    .commit-msg { margin-top: 0.3rem; font-size: 0.875rem; }
    .commit-meta { margin-top: 0.2rem; font-size: 0.75rem; color: var(--muted); }

    .metrics-row {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .metric { }
    .metric-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--green);
      font-family: var(--mono);
    }
    .metric-label { font-size: 0.75rem; color: var(--muted); }

    .focus-version {
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--yellow);
      margin-bottom: 0.25rem;
    }
    .focus-title { font-weight: 600; margin-bottom: 0.25rem; }
    .focus-summary { font-size: 0.875rem; color: var(--muted); }

    section { margin-bottom: 1.5rem; }
    section > h2 {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .cap-list { list-style: none; display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .cap-item {
      background: var(--tag-bg);
      border: 1px solid var(--tag-border);
      border-radius: 4px;
      padding: 0.2rem 0.6rem;
      font-size: 0.8rem;
      font-family: var(--mono);
    }
    .cap-version { color: var(--muted); margin-right: 0.3rem; }

    .roadmap-list { list-style: none; }
    .roadmap-item {
      display: grid;
      grid-template-columns: 5.5rem 1fr;
      gap: 0.75rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
      align-items: start;
    }
    .roadmap-item:last-child { border-bottom: none; }
    .roadmap-ver {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--yellow);
      padding-top: 0.1rem;
    }
    .roadmap-title { font-size: 0.875rem; font-weight: 600; }
    .roadmap-summary { font-size: 0.8rem; color: var(--muted); margin-top: 0.1rem; }

    .synced-at { font-size: 0.75rem; color: var(--muted); margin-top: 2rem; text-align: right; }
    #load-error { color: #f85149; margin: 2rem 0; display: none; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>VCSE</h1>
    <p>Verification and Reasoning Engine for Correctness Models</p>
  </header>

  <p id="load-error">Failed to load project data.</p>

  <div class="grid">
    <div class="card" id="card-release">
      <h2>Current Release</h2>
      <div class="version-badge" id="rel-version">—</div>
      <div class="release-title" id="rel-title">—</div>
      <a class="release-link" id="rel-url" href="#" target="_blank">View release →</a>
    </div>
    <div class="card" id="card-commit">
      <h2>Latest Commit</h2>
      <a class="commit-sha" id="commit-sha" href="#" target="_blank">—</a>
      <div class="commit-msg" id="commit-msg">—</div>
      <div class="commit-meta" id="commit-meta">—</div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Validation Metrics</h2>
      <div class="metrics-row" id="metrics-row">
        <div class="metric">
          <div class="metric-value" id="m-pytest">—</div>
          <div class="metric-label">pytest passed</div>
        </div>
        <div class="metric">
          <div class="metric-value" id="m-gauntlet">—</div>
          <div class="metric-label">gauntlet passed</div>
        </div>
        <div class="metric">
          <div class="metric-value" id="m-fvc">—</div>
          <div class="metric-label">false_verified</div>
        </div>
        <div class="metric">
          <div class="metric-value" id="m-warns">—</div>
          <div class="metric-label">warnings</div>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>Immediate Focus</h2>
      <div class="focus-version" id="focus-ver">—</div>
      <div class="focus-title" id="focus-title">—</div>
      <div class="focus-summary" id="focus-summary">—</div>
    </div>
  </div>

  <section>
    <h2>Current Capabilities</h2>
    <ul class="cap-list" id="cap-list"></ul>
  </section>

  <section>
    <h2>Roadmap</h2>
    <ul class="roadmap-list" id="roadmap-list"></ul>
  </section>

  <div class="synced-at" id="synced-at"></div>
</div>

<script>
  function text(id, val) { document.getElementById(id).textContent = val; }
  function link(id, href, label) {
    const el = document.getElementById(id);
    el.href = href;
    el.textContent = label;
  }

  fetch("data/projects/vcse.json")
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(p => {
      text("rel-version", p.latest_release_tag || p.current_version);
      text("rel-title", p.latest_validated_release?.title || "");
      const relUrl = document.getElementById("rel-url");
      relUrl.href = p.latest_release_url || "#";
      relUrl.textContent = p.latest_release_url ? "View release →" : "";

      const c = p.latest_commit;
      if (c) {
        link("commit-sha", c.url, c.short_sha);
        text("commit-msg", c.message);
        const d = c.committed_at ? new Date(c.committed_at).toLocaleString() : "";
        text("commit-meta", d);
      }

      const v = p.validation || {};
      const pt = v.pytest || {};
      const g = v.gauntlet || {};
      text("m-pytest", pt.passed ?? "—");
      text("m-gauntlet", `${g.passed ?? "—"}/${g.total ?? "—"}`);
      text("m-fvc", g.false_verified_count ?? "—");
      text("m-warns", pt.warnings ?? "—");

      const f = p.immediate_focus;
      if (f) {
        text("focus-ver", f.version);
        text("focus-title", f.title);
        text("focus-summary", f.summary || "");
      }

      const capList = document.getElementById("cap-list");
      (p.capabilities || []).forEach(cap => {
        const li = document.createElement("li");
        li.className = "cap-item";
        li.innerHTML = `<span class="cap-version">${cap.version}</span>${cap.title}`;
        capList.appendChild(li);
      });

      const roadList = document.getElementById("roadmap-list");
      (p.roadmap?.next || []).forEach(item => {
        const li = document.createElement("li");
        li.className = "roadmap-item";
        li.innerHTML = `
          <div class="roadmap-ver">${item.version}</div>
          <div>
            <div class="roadmap-title">${item.title}</div>
            <div class="roadmap-summary">${item.summary}</div>
          </div>`;
        roadList.appendChild(li);
      });

      if (p.synced_at) {
        text("synced-at", `Last synced: ${new Date(p.synced_at).toLocaleString()}`);
      }
    })
    .catch(() => {
      document.getElementById("load-error").style.display = "block";
    });
</script>
</body>
</html>
