name: Update site project status

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-project-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync project status
        run: python site/scripts/sync_project_status.py

      - name: Commit updated project status
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add site/data/
          git diff --cached --quiet || git commit -m "chore: sync project status"
          git push
